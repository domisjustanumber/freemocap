# SC offsets share one symmetric reference geometry across body trackers.
# Ratios are projections of (SC - shoulder midpoint) onto lateral/anterior/up,
# divided by shoulder width, using the standard-human reference pose.
# Calibrated to SC/notch 70% and xiphoid 60% depth. Project in the
# hip-midpoint -> shoulder-midpoint frame, including its reference-pose tilt.
left_sternoclavicular:
  form: anatomical_offset
  origin:
  - body/left_shoulder
  - body/right_shoulder
  frame:
    up:
      from:
      - body/left_hip
      - body/right_hip
      to:
      - body/left_shoulder
      - body/right_shoulder
      kind: exact
    lateral:
      from: body/left_shoulder
      to: body/right_shoulder
      kind: approximate
  offset:
    lateral: -0.062498631
    anterior: 0.234184536150
    up: -0.009467177190
  reference_length:
    from: body/left_shoulder
    to: body/right_shoulder
right_sternoclavicular:
  form: anatomical_offset
  origin:
  - body/left_shoulder
  - body/right_shoulder
  frame:
    up:
