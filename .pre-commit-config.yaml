# Run `uv run pre-commit install` once in each clone (decision 0001).
# It installs the pre-commit hooks, the commit-msg hook and the pre-push hook. Run it again after
# this file changes.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Without this line, the hooks with no `stages` (also check-yaml) run on each commit
# message and each push too.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      # The v2.3.0 manifest sets `stages: [commit, push, manual]`, and default_stages does not
      # change that. Without this line, the hook changes files on each push and stops the push.
      - id: trailing-whitespace
        stages: [pre-commit]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # The tools use only the standard library. `--no-project` does not sync the project environment,
  # which needs the sibling checkouts of [tool.uv.sources].
  - repo: local
    hooks:
      - id: private-data
        name: private data
        entry: uv run --no-project python tools/check_private_data.py
        language: system
        pass_filenames: false
      # A camera recording or a camera frame in the files of the commit. Golden reference files pass.
      # The hook also prints a reminder for an image. The reminder does not stop the commit.
      - id: camera-media
        name: camera recordings and frames
        entry: uv run --no-project python tools/check_camera_media.py
        language: system
        verbose: true
      # An entry ID that a different file has on another branch or worktree.
      - id: decision-log-ids
        name: decision log IDs
        entry: uv run --no-project python tools/check_decision_log.py --collisions
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # AI attribution in a commit message. The hook warns. It does not stop the commit.
      - id: ai-attribution
        name: AI attribution
        entry: uv run --no-project python tools/check_ai_attribution.py
        language: system
        stages: [commit-msg]
        verbose: true
