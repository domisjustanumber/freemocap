[project]
name = "freemocap"
version = "2.0.0a25"  # bumpver
description = "A free and open source markerless motion capture system for everyone 💀✨"
readme = "README.md"
requires-python = "==3.13.18"
dependencies = [
    "pyarrow>=25.0.1",
    "polars==2.1.0",  # the skellycam and skellytracker pin
    "plotly>=6,<7",
    "filelock>=3.0",
    "PyYAML==6.0.3",  # the skellytracker pin
    #    "aniposelib>=0.7.0",
    "numba>=0.65.1",
    "libsass>=0.23.0",
    "opencv-contrib-python==5.1.0.95",  # the skellycam and skellytracker pin; tests/test_opencv_matches_skellytracker.py checks it
    "pyinstaller==6.22.3",  # the skellytracker pin (its pyinstaller extra)
    "requests==2.34.2",  # the skellytracker pin
    "pydantic==2.14.3",  # the skellycam and skellytracker pin
    "numpydantic==2.0.0",  # the skellycam and skellytracker pin
    "scikit-learn>=1.7.2",
    "tomli-w>=1.2.0",
    "scipy-stubs~=1.18.1",  # matches the scipy==1.18.1 of skellycam and skellytracker
    "beartype==0.23.1",  # the skellytracker pin (ADR-M2C6); the 0.23.0 class-dictionary concern is retested
    "msgspec==0.22.0",  # the skellycam pin
    "psutil==7.2.2",  # the skellycam and skellytracker pin; freemocap imports it directly
    "cbor2>=5.6.0",
    "pylsl>=1.18.6,<2",
    #sub-skellies
    "freemocap_blender_addon",
    "skellycam",
    "skellyforge",
    "skelly_synchronize",
    #skelly utils
    "skellylogs",
    "skellypings",
    #    "skellymodels",
    "skellytracker[mediapipe]",
]


[tool.uv.sources]
# Development uses the sibling checkouts managed by the project workspace.
skellycam = { path = "../skellycam", editable = true }
skellytracker = { path = "../skellytracker", editable = true }
skellyforge = { path = "../skellyforge", editable = true }
freemocap_blender_addon = { path = "../freemocap_blender_addon", editable = true }
# Local for now (user, 2026-11-19): the dom/sidecar-implementation branch with Python ==3.13.18 is not pushed.
skelly_synchronize = { path = "../skellysync", editable = true }

skellylogs = { path = "../utils/skellylogs", editable = true }
skellypings = { path = "../utils/skellypings", editable = true }

# Clone/switch metadata for the workspace tools; UV installs the paths above.
[tool.freemocap.workspace.sources]
skellycam = { git = "https://github.com/freemocap/skellycam", branch = "sfn26" }
skellytracker = { git = "https://github.com/freemocap/skellytracker", branch = "dom/sidecar-implementation" }
skellyforge = { git = "https://github.com/freemocap/skellyforge", branch = "sfn26" }
freemocap_blender_addon = { git = "https://github.com/freemocap/freemocap_blender_addon", branch = "sfn26" }
skellylogs = { git = "https://github.com/freemocap/skellylogs" }
skellypings = { git = "https://github.com/freemocap/skellypings" }

[project.scripts]
freemocap = "freemocap.__main__:run_main"
[tool.setuptools]
packages = { find = { include = ["freemocap", "freemocap.*"], exclude = ["freemocap.__pycache__", "freemocap.*.__pycache__"] } }

[tool.setuptools.package-data]
freemocap = ["tests/streaming_fixtures/*.bin", "tests/fixtures/*.md", "tests/connected_recording_review.html", "core/mapping/yaml/*.yaml"]

  [tool.uv]
  package = true
  # Intel Mac is not supported, as in skellytracker.
  environments = [
      "sys_platform == 'darwin' and platform_machine == 'arm64'",
      "sys_platform == 'linux' and platform_machine == 'x86_64'",
      "sys_platform == 'win32' and platform_machine == 'AMD64'",
  ]
  required-environments = [
      "sys_platform == 'darwin' and platform_machine == 'arm64'",
      "sys_platform == 'linux' and platform_machine == 'x86_64'",
      "sys_platform == 'win32' and platform_machine == 'AMD64'",
  ]
  override-dependencies = [
      # Use core's existing utility source declarations throughout the graph. [@uvDependencyOverrides]
      "skellylogs",
      "skellypings",
  ]

  # This project uses opencv-contrib-python (a superset of opencv-python); having
  # both installed causes a file-collision error.
  exclude-dependencies = ["opencv-python"]


# ---- Version Bumping (bumpver) ----
# Run with: uv run poe bump-alpha   (see [tool.poe.tasks] in poe_tasks.toml)
#
# `current_version` below is the ONE canonical version. bumpver writes it to
# every file in the format that ecosystem requires:
#   - pyproject.toml `version`               PEP 440,  e.g. 2.0.0a2        (pip/uv)
#   - freemocap/__init__.py `__version__`     SemVer,   e.g. 2.0.0-alpha.2  (Python runtime; no `v`,
#                                             as skellycertify reports require)
#   - freemocap-ui/package.json `version`     npm semver, e.g. 2.0.0-alpha.2 (Electron)
#   - freemocap-docs .../downloads.ts         display,  e.g. 2.0.0-alpha.2  (docs site)
#
# The v2 rewrite lives on `development`, which branched before the v1.5+ tags,
# so `git describe` still resolves to v1.4.7. Every bump command therefore passes
# --ignore-vcs-tag to bypass those stale VCS tags (baked into the poe tasks).
[tool.bumpver]
current_version = "v2.0.0-alpha.25"
version_pattern = "vMAJOR.MINOR.PATCH[-TAG.NUM]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
# current_version (the canonical field in [tool.bumpver] above) MUST be listed here
# explicitly: bumpver only auto-updates current_version when the config file is
# ABSENT from file_patterns. pyproject.toml is present (for the [project] version
# line below), which suppresses that auto-update — so without the first pattern here,
# current_version never advances and every bump recomputes the same already-released
# version, producing an empty diff ("nothing to commit") and a duplicate tag.
"pyproject.toml" = [
    'current_version = "{version}"',
    # The `# bumpver` marker pins this to the [project] version line ONLY — a bare
    # `version = "..."` pattern also matches the rtmlib [[tool.uv.dependency-metadata]]
    # pin above and clobbers it. (Both the marker and that pin go away when rtmlib does.)
    'version = "{pep440_version}"  # bumpver',
]
"freemocap/__init__.py" = ['__version__ = "MAJOR.MINOR.PATCH[-TAG.NUM]"']
"freemocap-ui/package.json" = ['"version": "MAJOR.MINOR.PATCH[-TAG.NUM]"']
# freemocap-docs is a separate repo (not tracked here), so bumpver can't git-add it
# — its DEFAULT_VERSION is bumped in that repo, not from freemocap.




# =============================================================================
# Dev dependencies
# =============================================================================
# Install with:  uv sync --group dev
# =============================================================================

[dependency-groups]
dev = [
    "rich>=14.1.0",
    "bumpver",
    "pip-tools",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.0.0",
    "httpx==0.28.1",  # the skellycam pin
    "pyinstaller==6.22.3",  # the skellytracker pin
    "ruff>=0.9.0",
    "poethepoet>=0.32.0",
    # The legacy tracker benchmark only (the old YOLOX dynamic batch); the pin of skellytracker's onnx extra.
    # Deleted with the legacy tracker benchmark at skellytracker stage 2.4 (user ruling D1 a).
    "onnx==1.22.0",
]
# Poe the Poet tasks live in poe_tasks.toml
# Run with:   uv run poe <task-name>       (e.g. uv run poe update)
# List all:   uv run poe --help


# =============================================================================
# Pytest config
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"
markers = [
    "e2e: end-to-end tests that run real pipelines against on-disk test data (freemocap_test_data)",
    "slow: slow tests (e.g. realtime full-skeleton RTMPose inference over all frames)",
]


# =============================================================================
# Ruff linter config
# =============================================================================
# TC rules move imports that are ONLY used in type annotations behind an
# `if TYPE_CHECKING:` block, so they don't execute at runtime. This makes
# multiprocessing child process spawns faster (fewer files to import).
#
# Ruff automatically detects and preserves imports used in:
#   - isinstance() / issubclass() calls
#   - Base classes
#   - Default values and runtime expressions
#   - Pydantic field types (via runtime-evaluated-base-classes below)
#   - Dataclass field types (via runtime-evaluated-decorators below)
#
# If ruff incorrectly flags an import that IS needed at runtime,
# add  # noqa: TC003  (or TC001/TC002) to that import line.
# =============================================================================

[tool.ruff.lint]
select = [
    "TC",    # flake8-type-checking: move type-only imports behind TYPE_CHECKING
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates field type annotations at runtime for validation/serialization.
# Imports used as field types on these base classes must NOT be moved behind
# TYPE_CHECKING or Pydantic will fail at class creation.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic.BaseSettings",
]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
]
exempt-modules = ["typing", "typing_extensions"]
